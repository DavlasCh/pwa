<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accesorios Móviles</title>

    <!-- Manifest PWA -->
    <link rel="manifest" href="manifest.json" />

    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header class="app-header">
        <div class="header-inner">
            <h1>Accesorios Móviles</h1>
            <p>Selecciona productos, arma tu carrito y registra pedidos.</p>
        </div>
    </header>

    <main class="layout">
        <!-- Columna izquierda: productos -->
        <section class="col-main">
            <h2 class="section-title">Productos</h2>
            <p class="section-subtitle">Toca “Agregar” para enviarlos al carrito.</p>
            <section id="productos" class="grid"></section>
        </section>

        <!-- Columna derecha: carrito + pedidos + cámara -->
        <section class="col-side">
            <section id="carrito" class="panel">
                <h2 class="section-title">Carrito</h2>
                <ul id="lista-carrito" class="list"></ul>
                <div class="cart-footer">
                    <p id="total" class="total">Total: $0</p>
                    <button id="btn-comprar" class="btn-primary">Finalizar compra</button>
                </div>
            </section>

            <section id="pedidos" class="panel">
                <h2 class="section-title">Pedidos realizados</h2>
                <ul id="lista-pedidos" class="list list-pedidos"></ul>
            </section>

            <section id="camara" class="panel">
                <h2 class="section-title">Cámara</h2>
                <p class="section-subtitle">Puedes tomar una foto de referencia del pedido.</p>

                <div class="camera-wrapper">
                    <video
                        id="video-camara"
                        autoplay
                        playsinline
                    ></video>
                    <canvas id="foto-camara" style="display:none;"></canvas>
                </div>

                <div class="camera-actions">
                    <button id="btn-iniciar-camara" class="btn-secondary">Encender cámara</button>
                    <button id="btn-tomar-foto" class="btn-secondary">Tomar foto</button>
                    <button id="btn-detener-camara" class="btn-ghost">Apagar</button>
                </div>

                <div id="contenedor-foto" class="camera-photo"></div>
            </section>
        </section>
    </main>

    <footer class="app-footer">
        <p>© Accesorios Móviles · PWA</p>
    </footer>

    <!-- Firebase compat -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <!-- Lógica de la app (sin cambios) -->
    <script src="app.js"></script>
</body>
</html>
